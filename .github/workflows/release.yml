# Builds the addon zip and publishes it when a tag is pushed (e.g. v1.0.1), with the
# BigWigs packager (https://github.com/BigWigsMods/packager):
#   - creates the GitHub release with the zip attached;
#   - uploads the zip to CurseForge (project ID in Tessera.toc, ## X-Curse-Project-ID).
# The file type comes from the tag name: "alpha" -> Alpha, "beta" -> Beta, anything else
# (v1.0.1, v1.1.0-rc1...) -> Release. Files left out of the zip are listed in .pkgmeta.
# Needs one repository secret: CF_API_KEY (a CurseForge API token).
name: Package and release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write # lets the packager create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get the code (with history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # -l: no @localization@ replacement for now. The CurseForge localization tool has
          # no strings yet, and fetching them stops the packager. Remove "-l" once the
          # English strings are imported on CurseForge (docs/localization/enUS.lua), so the
          # community translations get packaged into the Locales stub files.
          args: -l
