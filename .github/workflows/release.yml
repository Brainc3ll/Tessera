# Publishes a new version of Tessera, with the BigWigs packager
# (https://github.com/BigWigsMods/packager):
#   1. sends the English and French strings to CurseForge's localization tool
#      (docs/localization/enUS.lua and frFR.lua), so translators always see the current
#      strings and our French stays the reference;
#   2. builds the zip, with the community translations for the other languages;
#   3. creates the GitHub release with the zip, and uploads the zip to CurseForge and Wago (project
#      ID in Tessera.toc, ## X-Curse-Project-ID), with the version's section of CHANGELOG.md
#      as release notes. The packager's own naming is kept: release titled after the tag
#      (v1.0.1) and zip named Tessera-v1.0.1-forever.zip. The "-forever" suffix is for the
#      Forever-only addon: drop it when the multi-versions branch is merged.
#
# Two ways to start it:
#   - "Run workflow" in the Actions tab (or `gh workflow run release.yml`): the version is
#     read from Tessera.toc (## Version), the tag v<version> is created, then everything
#     above runs. Nothing else to do.
#   - pushing a tag yourself (e.g. v1.0.1).
# The CurseForge file type comes from the tag: "alpha" -> Alpha, "beta" -> Beta, anything
# else (v1.0.1, v1.1.0-rc3...) -> Release. Files left out of the zip are listed in .pkgmeta.
# Needs two repository secrets: CF_API_KEY (a CurseForge API token) and WAGO_API_TOKEN
# (a Wago Addons API key; project ID in Tessera.toc, ## X-Wago-ID).
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write # lets the job create the tag and the GitHub release

env:
  CF_PROJECT: "1736530"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get the code (with history, for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # "Run workflow": create the tag of the version written in Tessera.toc
      - name: Create the version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          version=$(grep -m1 '^## Version:' Tessera.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::The tag ${tag} already exists: change ## Version in Tessera.toc first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Tessera ${version}"
          git push origin "${tag}"
          echo "Created ${tag}"

      # Version being released, and the notes of that version only (its section of
      # CHANGELOG.md), used as release notes on GitHub and CurseForge (.pkgmeta)
      - name: Release notes of this version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(grep -m1 '^## Version:' Tessera.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          awk -v v="## ${version} " 'index($0, v) == 1 { on = 1; print; next } on && /^## / { exit } on { print }' \
            CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          echo "Notes of ${version}:"; head -5 RELEASE_NOTES.md

      # English (base language) and French (our own translation) sent to CurseForge.
      # Phrases that no longer exist in the addon are kept there ("DoNothing"), so no
      # translator's work is ever deleted by mistake. If CurseForge refuses, the release
      # still goes on, without fetching the translations (step below).
      - name: Send the English and French strings to CurseForge
        id: localization
        continue-on-error: true
        run: |
          set -e
          url="https://wow.curseforge.com/api/projects/${CF_PROJECT}/localization/import"
          for lang in enUS frFR; do
            echo "Sending ${lang}..."
            code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
              -H "X-Api-Token: ${CF_API_KEY}" \
              -F "metadata={ \"language\": \"${lang}\", \"missing-phrase-handling\": \"DoNothing\" }" \
              -F "localizations=<docs/localization/${lang}.lua" \
              "${url}")
            echo "HTTP ${code}: $(head -c 300 response.txt)"
            if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then exit 1; fi
          done

      # Strings sent: the community translations are packaged into the Locales stub files.
      # Fetching them happens while the files are copied, before anything is uploaded, so
      # if it fails the step below can safely package again without them.
      - name: Package and upload (with community translations)
        id: package
        if: steps.localization.outcome == 'success'
        continue-on-error: true
        uses: BigWigsMods/packager@v2

      # Strings not sent, or translations not fetched: package without them (-l). English
      # and French are in the addon anyway.
      - name: Package and upload (without community translations)
        if: steps.localization.outcome != 'success' || steps.package.outcome == 'failure'
        uses: BigWigsMods/packager@v2
        with:
          args: -l

