# Runs on every push and pull request: static checks (luacheck), the mock run of the addon
# in English, French and DataBroker mode (tools/mock_run.lua, with a dungeon + combat
# scenario), the robustness test of the blocks (tools/fuzz_blocks.lua), the WoW API audit
# (tools/api_audit.py, Ketho's annotations), the WoW Forever API check (tools/forever_api_check.py,
# the function list of the real client), forever-lint (Forever's rules: moved or fallback-only
# functions, secret values, events, TOC), and the documentation check
# (tools/check_docs.lua: README, in-game help, descriptions, changelog and CurseForge strings
# must follow the code). A red cross on a commit means one of them found a problem.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-check >/dev/null

      - name: Static checks
        run: luacheck .

      # Lua refuses a file with more than 200 locals alive at once: we keep every file under 160
      - name: Locals and upvalues per file
        run: python3 tools/check_locals.py .

      # forever-lint (JoseArgento, MIT): what Forever 1.60.1 changed for addons. Pinned version;
      # stops on a warning or worse (notes, like the old chat names kept as fallbacks, pass)
      - name: forever-lint
        run: |
          pip install -q forever-lint==0.2.0
          forever-lint --no-color --fail-on warning .

      - name: Translations (Locales/ against the English strings)
        run: |
          for f in Locales/*.lua; do
            case "$f" in */enUS.lua|*/frFR.lua) continue ;; esac
            python3 tools/check_translation.py "$f" | tail -1
            python3 tools/check_translation.py "$f" | grep -q " 0 error(s)" || { python3 tools/check_translation.py "$f" | grep -i "^error"; exit 1; }
          done

      - name: Mock run (English, French, DataBroker mode, the other languages)
        run: |
          for args in "enUS" "frFR" "frFR broker" "deDE" "esES" "esMX" "ptBR"; do
            out=$(lua5.1 tools/mock_run.lua . $args 2>&1)
            echo "$out" | tail -3
            if echo "$out" | grep -q "ERROR\|lua5.1:"; then echo "$out" | grep "ERROR\|lua5.1:"; exit 1; fi
          done

      - name: Old saved variables (rc9 on the WoW Forever beta) convert to full-name keys
        run: |
          out=$(TESSERA_SV=tools/fixtures/sv-rc9-forever.lua TESSERA_FULLNAME="Nora Quill" TESSERA_REALM="Classic PvE" lua5.1 tools/mock_run.lua . enUS 2>&1 | grep "^SV\|LOAD ERROR\|EVENT ERROR")
          echo "$out"
          if echo "$out" | grep -q "Classic Beta\|ERROR"; then exit 1; fi
          echo "$out" | grep -q "^SV chars: Mira Fenwick | Nora Quill | Tobin Harrow$"

      - name: Blocks survive a changing game (WoW Forever's own blocks and the newest ones)
        run: lua5.1 tools/fuzz_blocks.lua .

      # The audit addon reviewers use (e.g. r/WoWUI): Lua Language Server + Ketho's WoW API
      # annotations. Fails on unknown globals and deprecated functions (tools/api_audit.py).
      # Keep the Lua Language Server between runs: GitHub's download server sometimes answers 504 for a while.
      - name: Cache the Lua Language Server
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/luals
          key: luals-3.19.2-linux-x64

      - name: WoW API audit (Ketho's annotations)
        run: |
          if [ ! -x "$RUNNER_TEMP/luals/bin/lua-language-server" ]; then
            # GitHub sometimes answers the download with an error page: fail on it and try again.
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o luals.tgz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
            mkdir -p "$RUNNER_TEMP/luals" && tar xzf luals.tgz -C "$RUNNER_TEMP/luals" && rm luals.tgz
          fi
          git clone -q --depth 1 https://github.com/Ketho/vscode-wow-api.git "$RUNNER_TEMP/wowapi"
          python3 tools/api_audit.py "$RUNNER_TEMP/luals/bin/lua-language-server" "$RUNNER_TEMP/wowapi"

      # Ketho's dump of WoW Forever's own client (branch "forever"): every C_ call Tessera makes
      # must exist there, or have a fallback (tools/forever_api_check.py).
      - name: WoW Forever API check (functions of the real client)
        run: |
          git clone -q --depth 1 -b forever https://github.com/Ketho/BlizzardInterfaceResources.git "$RUNNER_TEMP/bir"
          python3 tools/forever_api_check.py "$RUNNER_TEMP/bir"

      - name: Documentation check
        run: lua5.1 tools/check_docs.lua .
