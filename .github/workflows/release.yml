# Publishes a new version of Tessera, with the BigWigs packager
# (https://github.com/BigWigsMods/packager):
#   0. checks that the documentation is up to date (tools/check_docs.lua);
#   1. builds the zip, with every translation of Locales/ as it is in the repository;
#   2. creates the GitHub release with the zip, and uploads the zip to CurseForge and Wago (project
#      ID in Tessera.toc, ## X-Curse-Project-ID), with the version's section of CHANGELOG.md
#      as release notes. The packager's own naming is kept: release titled after the tag
#      (v1.0.1) and zip named Tessera-v1.0.1-forever.zip. The "-forever" suffix is for the
#      Forever-only addon: drop it when the multi-versions branch is merged.
#
# Two ways to start it:
#   - "Run workflow" in the Actions tab (or `gh workflow run release.yml`): the version is
#     read from Tessera.toc (## Version), the tag v<version> is created, then everything
#     above runs. Nothing else to do.
#   - pushing a tag yourself (e.g. v1.0.1).
# The CurseForge file type comes from the tag: "alpha" -> Alpha, "beta" -> Beta, anything
# else (v1.0.1, v1.1.0-rc3...) -> Release. Files left out of the zip are listed in .pkgmeta.
# Needs two repository secrets: CF_API_KEY (a CurseForge API token) and WAGO_API_TOKEN
# (a Wago Addons API key; project ID in Tessera.toc, ## X-Wago-ID).
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write # lets the job create the tag and the GitHub release

env:
  CF_PROJECT: "1736530"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get the code (with history, for the changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The documentation must follow the code (README, help, descriptions, changelog,
      # strings for CurseForge): tools/check_docs.lua lists what is out of date, and a
      # failure stops the release here, before any tag or upload
      - name: Check the documentation
        run: |
          # the package servers sometimes fail: try apt twice, then build Lua 5.1.5 from
          # lua.org (checked against its known SHA-256)
          LUA=lua5.1
          for try in 1 2; do
            sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 >/dev/null && break
            echo "apt failed (try $try of 2)"; LUA=""; sleep 20
          done
          if ! command -v lua5.1 >/dev/null; then
            curl -sSL -o /tmp/lua.tgz https://www.lua.org/ftp/lua-5.1.5.tar.gz
            echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  /tmp/lua.tgz" | sha256sum -c -
            tar xzf /tmp/lua.tgz -C /tmp && make -s -C /tmp/lua-5.1.5 posix >/dev/null
            sudo install -m 755 /tmp/lua-5.1.5/src/lua /usr/local/bin/lua5.1
            LUA=lua5.1
          fi
          LUA=${LUA:-lua5.1}
          "$LUA" tools/check_docs.lua . release

      # "Run workflow": create the tag of the version written in Tessera.toc
      - name: Create the version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          version=$(grep -m1 '^## Version:' Tessera.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::The tag ${tag} already exists: change ## Version in Tessera.toc first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Tessera ${version}"
          git push origin "${tag}"
          echo "Created ${tag}"

      # Version being released, and the notes of that version only (its section of
      # CHANGELOG.md), used as release notes on GitHub and CurseForge (.pkgmeta)
      - name: Release notes of this version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(grep -m1 '^## Version:' Tessera.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          awk -v v="## ${version} " 'index($0, v) == 1 { on = 1; print; next } on && /^## / { exit } on { print }' \
            CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          echo "Notes of ${version}:"; head -5 RELEASE_NOTES.md

      # Every translation lives in Locales/ (sent as GitHub pull requests or issues, see
      # docs/TRANSLATING.md): nothing is fetched from CurseForge's localization tool any more.
      # -l: the packager leaves the Locales files as they are.
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -l

