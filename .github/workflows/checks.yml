# Runs on every push and pull request: static checks (luacheck), the mock run of the addon
# in English, French and DataBroker mode (tools/mock_run.lua, with a dungeon + combat
# scenario), the robustness test of the blocks (tools/fuzz_blocks.lua), the WoW API audit
# (tools/api_audit.py, Ketho's annotations), and the documentation check
# (tools/check_docs.lua: README, in-game help, descriptions, changelog and CurseForge strings
# must follow the code). A red cross on a commit means one of them found a problem.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-check >/dev/null

      - name: Static checks
        run: luacheck .

      - name: Mock run (English, French, DataBroker mode)
        run: |
          for args in "enUS" "frFR" "frFR broker"; do
            out=$(lua5.1 tools/mock_run.lua . $args 2>&1)
            echo "$out" | tail -3
            if echo "$out" | grep -q "ERROR\|lua5.1:"; then echo "$out" | grep "ERROR\|lua5.1:"; exit 1; fi
          done

      - name: Blocks survive a changing game (WoW Forever's own blocks and the newest ones)
        run: lua5.1 tools/fuzz_blocks.lua .

      # The audit addon reviewers use (e.g. r/WoWUI): Lua Language Server + Ketho's WoW API
      # annotations. Fails on unknown globals and deprecated functions (tools/api_audit.py).
      - name: WoW API audit (Ketho's annotations)
        run: |
          curl -sSL -o luals.tgz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
          mkdir -p "$RUNNER_TEMP/luals" && tar xzf luals.tgz -C "$RUNNER_TEMP/luals" && rm luals.tgz
          git clone -q --depth 1 https://github.com/Ketho/vscode-wow-api.git "$RUNNER_TEMP/wowapi"
          python3 tools/api_audit.py "$RUNNER_TEMP/luals/bin/lua-language-server" "$RUNNER_TEMP/wowapi"

      - name: Documentation check
        run: lua5.1 tools/check_docs.lua .
